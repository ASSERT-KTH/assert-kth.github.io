<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b120d; --ink: #d8f5e0; --ink-2: #8fbf9f; --ink-3: #55805f;
    --green: #35e07c; --green-dim: #1f9e57; --line: #1d3323;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    height: 100vh; overflow: hidden;
  }
  /* sized against the cell's own frame (container units), so the panda
     fills the fullscreen monitor scene and stays compact in the grid tile */
  .stage {
    height: 100%; container-type: size;
    display: flex; align-items: center; justify-content: center;
  }
  .panda-row {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(10px, 3cqw, 28px); padding: clamp(6px, 4cqmin, 40px);
    width: 100%; height: 100%;
  }
  .panda-row svg { flex: none; width: min(28cqw, 70cqh); height: auto; }
  .bubble {
    position: relative;
    background: #0f1811;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: .8em 1em;
    color: var(--ink-2);
    line-height: 1.55;
    font-size: clamp(9px, min(3.2cqw, 5.4cqh), 16px);
  }
  /* tail pointing left, at the panda */
  .bubble::before {
    content: "";
    position: absolute;
    left: -.55em; top: 2.5em;
    border: .55em solid transparent;
    border-left: 0;
    border-right-color: var(--line);
  }
  .bubble .hi { color: var(--ink); }
  .bubble ol { margin: .4em 0 0 1.4em; }
  .bubble li { margin-bottom: .35em; }
  .bubble a { color: var(--green); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .bubble .title { color: var(--ink); font-weight: 700; }

  /* tall frame (fullscreen monitor scene): bubble above a big panda */
  @container (min-height: 320px) {
    .panda-row { flex-direction: column-reverse; gap: clamp(14px, 3.5cqh, 40px); padding-block: 6cqh; }
    .panda-row svg { width: min(40cqw, 38cqh); }
    .bubble { font-size: clamp(14px, min(2cqw, 3.3cqh), 34px); max-width: min(92cqw, 42em); }
    .bubble::before {
      left: 50%; top: 100%;
      border: .7em solid transparent;
      border-bottom: 0;
      border-top-color: var(--line);
      transform: translateX(-50%);
    }
  }
  .panda-row svg { animation: bob 3.8s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(3px); } to { transform: translateY(-3px); } }
  /* a friendly wave from the right paw, pivoting at the shoulder */
  .wave { transform-box: view-box; transform-origin: 80px 78px; animation: wave 2.4s ease-in-out infinite; }
  @keyframes wave {
    0%, 55%, 100% { transform: rotate(0deg); }
    65% { transform: rotate(-14deg); }
    75% { transform: rotate(6deg); }
    85% { transform: rotate(-10deg); }
  }
  @media (prefers-reduced-motion: reduce) { .panda-row svg, .wave { animation: none; } }
</style>
</head>
<body>
<main class="stage">
  <div class="panda-row">
    <svg viewBox="-8 0 116 112" role="img" aria-label="A happy black and white panda waving and holding a sprout">
      <!-- ears -->
      <circle cx="21" cy="19" r="13" fill="#0a0a0a"/>
      <circle cx="79" cy="19" r="13" fill="#0a0a0a"/>
      <circle cx="21" cy="19" r="6" fill="#2b2b2b"/>
      <circle cx="79" cy="19" r="6" fill="#2b2b2b"/>
      <!-- a patch of grass to stand on -->
      <ellipse cx="50" cy="105" rx="40" ry="5.5" fill="#1f9e57" opacity=".35"/>
      <path d="M16 105 l2 -5 l2 5 M80 105 l2 -6 l2 6 M86 106 l1.5 -4 l1.5 4" stroke="#35e07c" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- feet -->
      <ellipse cx="35" cy="102" rx="11" ry="7" fill="#0a0a0a"/>
      <ellipse cx="65" cy="102" rx="11" ry="7" fill="#0a0a0a"/>
      <!-- body + belly -->
      <ellipse cx="50" cy="85" rx="29" ry="21" fill="#f4f4f4"/>
      <ellipse cx="50" cy="89" rx="16" ry="12" fill="#e4e4e4"/>
      <!-- right arm, waving (behind the head, raised out to the side) -->
      <g class="wave">
        <ellipse cx="92" cy="66" rx="7.5" ry="12" fill="#0a0a0a" transform="rotate(-40 92 66)"/>
      </g>
      <!-- head -->
      <ellipse cx="50" cy="44" rx="38" ry="33" fill="#f4f4f4"/>
      <!-- eye patches, tilted like a real panda's -->
      <ellipse cx="34" cy="46" rx="10" ry="12.5" fill="#0a0a0a" transform="rotate(35 34 46)"/>
      <ellipse cx="66" cy="46" rx="10" ry="12.5" fill="#0a0a0a" transform="rotate(-35 66 46)"/>
      <!-- sprout held out in the left paw ("touch grass") -->
      <path d="M13 84 C11 76 9 70 7 62" stroke="#35e07c" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M7 63 C1 62 -2 57 -1 53 C4 53 7 57 7 63 Z" fill="#35e07c"/>
      <path d="M7 63 C10 58 15 57 18 59 C16 63 12 65 7 63 Z" fill="#1f9e57"/>
      <ellipse cx="15" cy="84" rx="8" ry="11" fill="#0a0a0a" transform="rotate(40 15 84)"/>
      <!-- happy closed eyes ^ ^ -->
      <path d="M29.5 48 Q34 42 38.5 48" stroke="#f4f4f4" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M61.5 48 Q66 42 70.5 48" stroke="#f4f4f4" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <!-- rosy cheeks -->
      <ellipse cx="25" cy="59" rx="6" ry="3.6" fill="#ff9fb2" opacity=".6"/>
      <ellipse cx="75" cy="59" rx="6" ry="3.6" fill="#ff9fb2" opacity=".6"/>
      <!-- nose -->
      <path d="M45.5 54 Q50 51.5 54.5 54 Q53.5 58 50 59 Q46.5 58 45.5 54 Z" fill="#0a0a0a"/>
      <!-- open smile with a little tongue -->
      <path d="M43 61 Q50 62.5 57 61 Q56 69 50 69.5 Q44 69 43 61 Z" fill="#2a1414"/>
      <path d="M46 66.8 Q50 63.8 54 66.8 Q52.5 69.3 50 69.4 Q47.5 69.3 46 66.8 Z" fill="#ff7f96"/>
    </svg>
    <div class="bubble">
      <span class="hi">I have two tasks for you today:</span>
      <ol>
        <li>Remember to go and touch grass throughout your day 🌱</li>
        <li>Read my newest paper: <span class="title">Smart Contract Invariants
            Protect Against Cybercriminals!</span><br>
            <a href="https://arxiv.org/pdf/2608.13191" target="_blank" rel="noopener">arxiv.org/pdf/2608.13191</a></li>
      </ol>
    </div>
  </div>
</main>
</body>
</html>
