<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b120d; --ink: #d8f5e0; --ink-2: #8fbf9f; --ink-3: #55805f;
    --green: #35e07c; --green-dim: #1f9e57; --line: #1d3323;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    height: 100vh; overflow: hidden;
  }
  /* sized against the cell's own frame (container units), so the panda
     fills the fullscreen monitor scene and stays compact in the grid tile */
  .stage {
    height: 100%; container-type: size;
    display: flex; align-items: center; justify-content: center;
  }
  .panda-row {
    display: flex; align-items: center; justify-content: center;
    gap: clamp(10px, 3cqw, 28px); padding: clamp(6px, 4cqmin, 40px);
    width: 100%; height: 100%;
  }
  .panda-row svg { flex: none; width: min(28cqw, 70cqh); height: auto; }
  .bubble {
    position: relative;
    background: #0f1811;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: .8em 1em;
    color: var(--ink-2);
    line-height: 1.55;
    font-size: clamp(9px, min(3.2cqw, 5.4cqh), 16px);
  }
  /* tail pointing left, at the panda */
  .bubble::before {
    content: "";
    position: absolute;
    left: -.55em; top: 2.5em;
    border: .55em solid transparent;
    border-left: 0;
    border-right-color: var(--line);
  }
  .bubble .hi { color: var(--ink); }
  .bubble ol { margin: .4em 0 0 1.4em; }
  .bubble li { margin-bottom: .35em; }
  .bubble a { color: var(--green); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .bubble .title { color: var(--ink); font-weight: 700; }

  /* tall frame (fullscreen monitor scene): bubble above a big panda */
  @container (min-height: 320px) {
    .panda-row { flex-direction: column-reverse; gap: clamp(14px, 3.5cqh, 40px); padding-block: 6cqh; }
    .panda-row svg { width: min(40cqw, 38cqh); }
    .bubble { font-size: clamp(14px, min(2cqw, 3.3cqh), 34px); max-width: min(92cqw, 42em); }
    .bubble::before {
      left: 50%; top: 100%;
      border: .7em solid transparent;
      border-bottom: 0;
      border-top-color: var(--line);
      transform: translateX(-50%);
    }
  }
  .panda-row svg { animation: bob 3.8s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(3px); } to { transform: translateY(-3px); } }
  @media (prefers-reduced-motion: reduce) { .panda-row svg { animation: none; } }
</style>
</head>
<body>
<main class="stage">
  <div class="panda-row">
    <svg viewBox="0 0 86 94" role="img" aria-label="A black and white panda">
      <!-- ears -->
      <circle cx="18" cy="16" r="12" fill="#0a0a0a"/>
      <circle cx="68" cy="16" r="12" fill="#0a0a0a"/>
      <!-- head -->
      <ellipse cx="43" cy="34" rx="32" ry="28" fill="#f4f4f4"/>
      <!-- eye patches -->
      <ellipse cx="30" cy="32" rx="10" ry="12" fill="#0a0a0a" transform="rotate(-15 30 32)"/>
      <ellipse cx="56" cy="32" rx="10" ry="12" fill="#0a0a0a" transform="rotate(15 56 32)"/>
      <!-- eyes -->
      <circle cx="32" cy="31" r="3.4" fill="#f4f4f4"/>
      <circle cx="54" cy="31" r="3.4" fill="#f4f4f4"/>
      <circle cx="32.8" cy="31" r="1.7" fill="#0a0a0a"/>
      <circle cx="53.2" cy="31" r="1.7" fill="#0a0a0a"/>
      <!-- nose + mouth -->
      <ellipse cx="43" cy="42" rx="4.5" ry="3.4" fill="#0a0a0a"/>
      <path d="M43 45 q0 4 -4 5 M43 45 q0 4 4 5" stroke="#0a0a0a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- body -->
      <ellipse cx="43" cy="76" rx="26" ry="17" fill="#f4f4f4"/>
      <!-- arms -->
      <ellipse cx="20" cy="70" rx="9" ry="13" fill="#0a0a0a" transform="rotate(20 20 70)"/>
      <ellipse cx="66" cy="70" rx="9" ry="13" fill="#0a0a0a" transform="rotate(-20 66 70)"/>
      <!-- belly line -->
      <ellipse cx="43" cy="79" rx="14" ry="10" fill="#e6e6e6"/>
    </svg>
    <div class="bubble">
      <span class="hi">I have two tasks for you today:</span>
      <ol>
        <li>Remember to go and touch grass throughout your day 🌱</li>
        <li>Read my newest paper: <span class="title">Smart Contract Invariants
            Protect Against Cybercriminals!</span><br>
            <a href="https://arxiv.org/pdf/2608.13191" target="_blank" rel="noopener">arxiv.org/pdf/2608.13191</a></li>
      </ol>
    </div>
  </div>
</main>
</body>
</html>
