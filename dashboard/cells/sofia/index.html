<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b120d; --ink: #d8f5e0; --ink-2: #8fbf9f; --ink-3: #55805f;
    --green: #35e07c; --green-dim: #1f9e57; --line: #1d3323;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; height: 100vh; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 14px;
  }
  .panda-row { display: flex; align-items: center; gap: 14px; max-width: 640px; }
  .panda-row svg { flex: none; }
  .bubble {
    position: relative;
    background: #0f1811;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: .8em 1em;
    color: var(--ink-2);
    line-height: 1.55;
    font-size: 12.5px;
  }
  .bubble::before {
    content: "";
    position: absolute;
    left: -7px; top: 32px;
    border: 7px solid transparent;
    border-left: 0;
    border-right-color: var(--line);
  }
  .bubble .hi { color: var(--ink); }
  .bubble ol { margin: .4em 0 0 1.4em; }
  .bubble li { margin-bottom: .35em; }
  .bubble a { color: var(--green); text-decoration: none; }
  .bubble a:hover { text-decoration: underline; }
  .bubble .title { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
  <div class="panda-row">
    <svg width="100" height="107" viewBox="0 0 86 92" role="img" aria-label="A black and white panda">
      <!-- ears -->
      <circle cx="18" cy="16" r="12" fill="#0a0a0a"/>
      <circle cx="68" cy="16" r="12" fill="#0a0a0a"/>
      <!-- head -->
      <ellipse cx="43" cy="34" rx="32" ry="28" fill="#f4f4f4"/>
      <!-- eye patches -->
      <ellipse cx="30" cy="32" rx="10" ry="12" fill="#0a0a0a" transform="rotate(-15 30 32)"/>
      <ellipse cx="56" cy="32" rx="10" ry="12" fill="#0a0a0a" transform="rotate(15 56 32)"/>
      <!-- eyes -->
      <circle cx="32" cy="31" r="3.4" fill="#f4f4f4"/>
      <circle cx="54" cy="31" r="3.4" fill="#f4f4f4"/>
      <circle cx="32.8" cy="31" r="1.7" fill="#0a0a0a"/>
      <circle cx="53.2" cy="31" r="1.7" fill="#0a0a0a"/>
      <!-- nose + mouth -->
      <ellipse cx="43" cy="42" rx="4.5" ry="3.4" fill="#0a0a0a"/>
      <path d="M43 45 q0 4 -4 5 M43 45 q0 4 4 5" stroke="#0a0a0a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <!-- body -->
      <ellipse cx="43" cy="76" rx="26" ry="17" fill="#f4f4f4"/>
      <!-- arms -->
      <ellipse cx="20" cy="70" rx="9" ry="13" fill="#0a0a0a" transform="rotate(20 20 70)"/>
      <ellipse cx="66" cy="70" rx="9" ry="13" fill="#0a0a0a" transform="rotate(-20 66 70)"/>
      <!-- belly line -->
      <ellipse cx="43" cy="79" rx="14" ry="10" fill="#e6e6e6"/>
    </svg>
    <div class="bubble">
      <span class="hi">I have two tasks for you today:</span>
      <ol>
        <li>Remember to go and touch grass throughout your day 🌱</li>
        <li>Read my newest paper: <span class="title">Smart Contract Invariants
            Protect Against Cybercriminals!</span><br>
            <a href="https://arxiv.org/pdf/2608.13191" target="_blank" rel="noopener">arxiv.org/pdf/2608.13191</a></li>
      </ol>
    </div>
  </div>
</body>
</html>
