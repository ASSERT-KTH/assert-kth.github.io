<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b120d; --ink: #d8f5e0; --ink-2: #8fbf9f; --ink-3: #55805f;
    --green: #35e07c; --green-dim: #1f9e57; --line: #1d3323;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* sized against the cell's own frame (container units), so the quote
     fills the fullscreen monitor scene and stays compact in the grid tile */
  .stage {
    flex: 1; min-height: 0; container-type: size;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: clamp(10px, 5cqmin, 56px);
    text-align: center;
    font-size: clamp(13px, min(3.9cqw, 8.5cqh), 60px);
  }
  blockquote {
    line-height: 1.4; color: var(--ink); max-width: 30em;
    text-wrap: balance; transition: opacity .6s;
  }
  blockquote::before { content: "“"; color: var(--green); font-size: 1.4em; }
  blockquote::after  { content: "”"; color: var(--green); font-size: 1.4em; }
  .fade { opacity: 0; }
  footer {
    flex: none; display: flex; align-items: baseline; gap: .7rem;
    padding: 5px 10px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink-3);
  }
  a { color: var(--green-dim); text-decoration: none; }
  a:hover { color: var(--green); }
</style>
</head>
<body>
  <main class="stage">
    <blockquote id="q"></blockquote>
  </main>
  <footer><a href="https://www.monperrus.net/martin/" target="_blank" rel="noopener">monperrus.net/martin →</a></footer>
<script>
  const quotes = [
    'Software never was perfect and won’t get perfect. But is that a license to create garbage?',
    'The best way to predict a bug is to write a test that finds it first.',
    'Automated program repair: because every patch deserves a second opinion.',
    'Reproducibility is a feature. Ship it.',
  ];
  const q = document.getElementById('q');
  let i = 0;
  function show() {
    q.classList.add('fade');
    setTimeout(() => {
      q.textContent = quotes[i % quotes.length];
      q.classList.remove('fade');
      i++;
    }, 600);
  }
  q.textContent = quotes[i++];
  setInterval(show, 8000);
</script>
</body>
</html>
