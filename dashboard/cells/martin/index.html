<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b120d; --ink: #d8f5e0; --ink-2: #8fbf9f; --ink-3: #55805f;
    --green: #35e07c; --green-dim: #1f9e57;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    height: 100vh; display: flex; flex-direction: column;
    justify-content: center; padding: 5vmin; overflow: hidden;
    /* sizes follow the cell's frame, so text grows in the fullscreen
       monitor scene and stays compact in the grid tile */
    font-size: clamp(13px, 1.6vw + 1.6vh, 48px);
  }
  blockquote {
    font-size: 1.15em; line-height: 1.5; color: var(--ink); max-width: 32em;
    transition: opacity .6s; min-height: 4.5em;
  }
  blockquote::before { content: "“"; color: var(--green); font-size: 1.4em; }
  blockquote::after  { content: "”"; color: var(--green); font-size: 1.4em; }
  .fade { opacity: 0; }
  a { color: var(--green-dim); text-decoration: none; font-size: .9em; margin-top: .9em; }
  a:hover { color: var(--green); }
</style>
</head>
<body>
  <blockquote id="q"></blockquote>
  <a href="https://www.monperrus.net/martin/" target="_blank" rel="noopener">monperrus.net/martin →</a>
<script>
  const quotes = [
    'Software never was perfect and won’t get perfect. But is that a license to create garbage?',
    'The best way to predict a bug is to write a test that finds it first.',
    'Automated program repair: because every patch deserves a second opinion.',
    'Reproducibility is a feature. Ship it.',
  ];
  const q = document.getElementById('q');
  let i = 0;
  function show() {
    q.classList.add('fade');
    setTimeout(() => {
      q.textContent = quotes[i % quotes.length];
      q.classList.remove('fade');
      i++;
    }, 600);
  }
  q.textContent = quotes[i++];
  setInterval(show, 8000);
</script>
</body>
</html>
