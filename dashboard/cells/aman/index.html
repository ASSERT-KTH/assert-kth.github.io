<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b120d; --ink: #d8f5e0; --ink-2: #8fbf9f; --ink-3: #55805f;
    --green: #35e07c; --green-dim: #1f9e57; --line: #1d3323;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    height: 100vh; overflow: hidden;
    display: flex; flex-direction: column;
  }
  /* sized against the cell's own frame (container units), so the quote
     fills the fullscreen monitor scene and stays compact in the grid tile */
  .stage {
    flex: 1; min-height: 0; container-type: size;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: clamp(10px, 5cqmin, 56px);
    text-align: center;
    font-size: clamp(13px, min(3.9cqw, 8.5cqh), 60px);
  }
  blockquote {
    line-height: 1.4; color: var(--ink); max-width: 30em;
    text-wrap: balance; transition: opacity .6s;
  }
  blockquote::before { content: "“"; color: var(--green); font-size: 1.4em; }
  blockquote::after  { content: "”"; color: var(--green); font-size: 1.4em; }
  .fade { opacity: 0; }
  footer {
    flex: none; display: flex; align-items: baseline; gap: .7rem;
    padding: 5px 10px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink-3);
  }
  a { color: var(--green-dim); text-decoration: none; }
  a:hover { color: var(--green); }
  cite {
    display: block; max-width: 90vw; font-style: normal;
    font-size: max(11px, .45em); line-height: 1.5;
    color: var(--ink-3); margin-top: .6em;
    transition: opacity .6s;
  }
</style>
</head>
<body>
  <main class="stage">
    <blockquote id="q"></blockquote>
    <cite id="c"></cite>
  </main>
  <footer><a href="https://algomaster99.github.io/publications" target="_blank" rel="noopener">algomaster99.github.io →</a></footer>
<script>
  const papers = [
    ['Trusting-Trust Attack against an Entire Linux Distribution through Binary Manipulation', 'Julien Malka, Aman Sharma, Martin Monperrus, Stefano Zacchiroli, and Théo Zimmermann · SCORED 2026'],
    ['Dependencies that Bundle Code and Execution', 'Aman Sharma and Martin Monperrus · arXiv, 2026'],
    ['zkSBOM: Privacy-Preserving SBOM Sharing with Zero-Knowledge Sets', 'Tom Sorger, Eric Cornelissen, Aman Sharma, Javier Ron, Musard Balliu, and Martin Monperrus · arXiv, 2026'],
    ['Classport: Designing Runtime Dependency Introspection for Java', 'Serena Cofano, Daniel Williams, Aman Sharma, and Martin Monperrus · arXiv, 2025'],
    ['Build and Runtime Integrity for Java', 'Aman Sharma · ICSE Companion, 2025'],
    ['Causes and Canonicalization of Unreproducible Builds in Java', 'Aman Sharma, Benoit Baudry, and Martin Monperrus · IEEE Transactions on Software Engineering, 2025'],
    ['SBOM.EXE: Countering Dynamic Code Injection based on Software Bill of Materials in Java', 'Aman Sharma, Martin Wittlinger, Benoit Baudry, and Martin Monperrus · arXiv, 2024'],
    ['Maven-Hijack: Software Supply Chain Attack Exploiting Packaging Order', 'Federico Bono, Frank Reyes, Aman Sharma, Benoit Baudry, and Martin Monperrus · SCORED 2025 · Distinguished Paper'],
    ['Software Bill of Materials in Java', 'Musard Balliu et al. · SCORED@CCS, 2023'],
    ['Challenges of Producing Software Bill of Materials for Java', 'Musard Balliu et al. · IEEE Security & Privacy, 2023'],
    ['Augmenting Diffs With Runtime Information', 'K. Etemadi, Aman Sharma, Fernanda Madeiral, and Martin Monperrus · IEEE Transactions on Software Engineering, 2022'],
    ['UPPERCASE IS ALL YOU NEED', 'Vivi Andersson and Aman Sharma'],
  ];
  const q = document.getElementById('q');
  const c = document.getElementById('c');
  let last = -1;
  function pick() {
    let i;
    do { i = Math.floor(Math.random() * papers.length); } while (i === last && papers.length > 1);
    last = i;
    return papers[i];
  }
  function render() {
    const [title, citation] = pick();
    q.textContent = title;
    c.textContent = citation;
  }
  function show() {
    q.classList.add('fade');
    c.classList.add('fade');
    setTimeout(() => {
      render();
      q.classList.remove('fade');
      c.classList.remove('fade');
    }, 600);
  }
  render();
  setInterval(show, 8000);
</script>
</body>
</html>
