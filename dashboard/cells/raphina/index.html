<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0b120d; --ink: #d8f5e0; --ink-2: #8fbf9f; --ink-3: #55805f;
    --green: #35e07c; --green-dim: #1f9e57; --amber: #e0b435; --line: #1d3323;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    height: 100vh; overflow: hidden;
  }
  #stars { position: fixed; inset: 0; width: 100%; height: 100%; }
  /* sized against the cell's own frame (container units), so the timeline
     fills the fullscreen monitor scene and stays compact in the grid tile */
  .stage {
    position: relative; height: 100%; container-type: size;
    display: flex; flex-direction: column;
    padding: clamp(8px, 4cqmin, 48px) clamp(10px, 5cqw, 72px);
    gap: clamp(4px, 2cqh, 24px);
  }
  .head {
    font-size: clamp(10px, min(3.6cqw, 7cqh), 34px); line-height: 1;
    color: var(--green); font-weight: 700; letter-spacing: .3em;
  }
  .head span { color: var(--ink-3); font-weight: 400; letter-spacing: .1em; }
  .kicker {
    font-size: clamp(8px, min(2.6cqw, 5cqh), 22px);
    color: var(--green-dim); letter-spacing: .14em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kicker b { color: var(--green); font-weight: 700; }
  .card {
    flex: 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center; gap: .25em;
  }
  .year {
    font-size: clamp(16px, min(9cqw, 17cqh), 120px); line-height: 1;
    color: var(--green); font-weight: 700; letter-spacing: .04em;
    text-shadow: 0 0 .4em rgba(53, 224, 124, .35);
  }
  .title {
    font-size: clamp(11px, min(5cqw, 9cqh), 64px); line-height: 1.2;
    color: var(--ink); font-weight: 700; text-transform: uppercase;
    overflow-wrap: anywhere;
  }
  /* long titles step down so title + English edition + author still fit */
  .title.long { font-size: clamp(10px, min(3.8cqw, 7cqh), 50px); }
  .title.xlong { font-size: clamp(9px, min(3cqw, 5.6cqh), 40px); }
  .caret { color: var(--green); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .en, .author, .note { opacity: 0; transition: opacity .6s; }
  .en { font-size: clamp(9px, min(3cqw, 5.6cqh), 32px); color: var(--ink-2); font-style: italic; }
  .en::before { content: "EN · "; font-style: normal; color: var(--ink-3); }
  .author { font-size: clamp(9px, min(3.4cqw, 6.4cqh), 36px); color: var(--ink-2); }
  .note { font-size: clamp(8px, min(2.8cqw, 5.4cqh), 28px); color: var(--amber); }
  .en:empty, .note:empty { display: none; }
  .show { opacity: 1; }

  .axis {
    display: flex; align-items: center; gap: .8em;
    font-size: clamp(8px, min(2.4cqw, 4.6cqh), 20px); color: var(--ink-3);
  }
  .track { position: relative; flex: 1; height: 1px; background: var(--line); }
  .track i {
    position: absolute; top: 50%; width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
    border-radius: 50%; background: var(--green-dim); opacity: .6;
  }
  .track i.on {
    width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; opacity: 1;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    transition: left .8s ease-in-out;
  }
  footer {
    display: flex; justify-content: space-between;
    font-size: clamp(8px, min(2.4cqw, 4.6cqh), 20px); color: var(--ink-3);
  }
  footer a { color: var(--green); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<main class="stage">
  <div class="head">✦ SCI-FI BOOKS <span>· award winners</span></div>
  <div class="kicker" id="kicker"></div>
  <div class="card" aria-live="polite">
    <div class="year" id="year"></div>
    <div class="title" id="titlebox"><span id="title"></span><span class="caret">▌</span></div>
    <div class="en" id="en"></div>
    <div class="author" id="author"></div>
    <div class="note" id="note"></div>
  </div>
  <div class="axis"><span id="first"></span><div class="track" id="track"></div><span id="last"></span></div>
  <footer>
    <a href="https://stamp9.github.io/" target="_blank" rel="noopener">stamp9.github.io</a>
    <span id="count"></span>
  </footer>
</main>

      [2025, 'Aż zobaczycie ogień', '', 'Paweł Majka'],
    ] },
  ];
  for (const a of AWARDS)
    a.books = a.books.map(([year, title, en, author, note = '']) => ({ year, title, en, author, note }));

  const STEP_MS = 8000, TYPE_MS = 45, PER_AWARD = 4;
  const $ = id => document.getElementById(id);
  // CJK glyphs are about twice as wide as Latin ones in a monospace font
  const width = s => [...s].reduce((n, c) => n + (c.codePointAt(0) > 0x2e80 ? 2 : 1), 0);

  // start at a random award and book, so each monitor pass shows different winners
  let ai = Math.floor(Math.random() * AWARDS.length), bi = 0, shown = 0, award, marker, typing;

  function enterAward() {
    award = AWARDS[ai];
    bi = Math.floor(Math.random() * award.books.length);
    shown = 0;
    $('kicker').innerHTML = '<b></b> · <span></span>';
    $('kicker').querySelector('b').textContent = award.name;
    $('kicker').querySelector('span').textContent = award.sub;
    $('kicker').lang = award.lang;

    const first = award.books[0].year, last = award.books[award.books.length - 1].year;
    award.at = year => `${(year - first) / (last - first) * 100}%`;
    $('first').textContent = first;
    $('last').textContent = last;
    const track = $('track');
    track.replaceChildren();
    for (const year of new Set(award.books.map(b => b.year))) {
      const dot = document.createElement('i');
      dot.style.left = award.at(year);
      track.appendChild(dot);
    }
    marker = document.createElement('i');
    marker.className = 'on';
    track.appendChild(marker);
  }

  function show() {
    if (shown === PER_AWARD || !award) {
      if (award) ai = (ai + 1) % AWARDS.length;
      enterAward();
    }
    const b = award.books[bi];
    $('year').textContent = b.year;
    $('count').textContent = `${bi + 1} / ${award.books.length}`;
    marker.style.left = award.at(b.year);
    for (const id of ['en', 'author', 'note']) $(id).classList.remove('show');
    $('en').textContent = b.en;
    $('author').textContent = b.author;
    $('note').textContent = b.note;
    $('titlebox').lang = $('author').lang = award.lang;
    const w = width(b.title);
    $('titlebox').className = 'title' + (w > 44 ? ' xlong' : w > 26 ? ' long' : '');

    clearInterval(typing);
    const chars = [...b.title];
    let n = 0;
    $('title').textContent = '';
    typing = setInterval(() => {
      $('title').textContent = chars.slice(0, ++n).join('');
      if (n >= chars.length) {
        clearInterval(typing);
        $('en').classList.add('show');
        $('author').classList.add('show');
        setTimeout(() => $('note').classList.add('show'), 500);
      }
    }, TYPE_MS);

    bi = (bi + 1) % award.books.length;
    shown++;
    setTimeout(show, STEP_MS);
  }
  show();

  // slow starfield drifting left; still frame when reduced motion is preferred
  const canvas = $('stars'), ctx = canvas.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [];
  function resize() {
    canvas.width = innerWidth * devicePixelRatio;
    canvas.height = innerHeight * devicePixelRatio;
    const count = Math.round(innerWidth * innerHeight / 2200);
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * canvas.width, y: Math.random() * canvas.height,
      z: Math.random() * .8 + .2, phase: Math.random() * 6.28,
    }));
  }
  function draw(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      if (!still) s.x = (s.x - s.z * .15 * devicePixelRatio + canvas.width) % canvas.width;
      const twinkle = .55 + .45 * Math.sin(t / 900 + s.phase);
      ctx.globalAlpha = s.z * twinkle * .7;
      ctx.fillStyle = s.z > .85 ? '#d8f5e0' : '#35e07c';
      ctx.fillRect(s.x, s.y, s.z * 1.6 * devicePixelRatio, s.z * 1.6 * devicePixelRatio);
    }
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener('resize', () => { resize(); if (still) draw(0); });
  resize();
  requestAnimationFrame(draw);
</script>
