<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vivi Andersson — cellular automata and Tilde</title>
<style>
  :root {
    --bg: #0b120d; --ink: #d8f5e0; --ink-2: #8fbf9f; --ink-3: #55805f;
    --green: #35e07c; --green-dim: #1f9e57; --line: #1d3323;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    height: 100vh; overflow: hidden; position: relative;
  }
  .scene { position: absolute; inset: 0; display: none; }
  .scene.active { display: flex; }
  #game-scene { flex-direction: column; }
  #board { flex: 1; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  footer {
    flex: none; display: flex; align-items: baseline; gap: .7rem;
    padding: 5px 10px; border-top: 1px solid var(--line);
    font-size: 11px; color: var(--ink-3);
  }
  .rule { color: var(--green-dim); letter-spacing: .08em; }
  .gen { margin-left: auto; font-variant-numeric: tabular-nums; }
  a { color: var(--green-dim); text-decoration: none; }
  a:hover { color: var(--green); }
  #cat-scene {
    align-items: center; justify-content: center; overflow: hidden;
    background: #090d0b; container-type: size;
  }
  #cat-scene.active { display: flex; }
  .cat-stage {
    width: min(100%, 980px); height: 100%; padding: clamp(6px, 2.2cqw, 28px);
    display: flex; flex-direction: row; align-items: center;
    justify-content: center; gap: clamp(12px, 2.2cqw, 24px);
  }
  #cat {
    display: block; flex: none;
    width: min(60cqw, 680px); height: min(90cqh, 680px);
    margin-inline-start: -36px;
    object-fit: contain; image-rendering: pixelated;
    animation: levitate 3.8s steps(6, end) infinite alternate;
  }
  .bubble {
    position: relative; z-index: 1; flex: none; white-space: nowrap;
    transform: translateY(-20px);
    padding: clamp(7px, 1.5cqw, 10px) clamp(9px, 2cqw, 16px);
    border: 0; border-radius: 9px;
    background: rgba(207, 239, 226, .88); color: #234954;
    box-shadow: 0 3px 8px rgba(35, 73, 84, .16), inset 0 1px 0 rgba(255, 255, 255, .35);
    font-size: clamp(11px, 2.1cqw, 20px); font-weight: 700;
  }
  .speaker { display: block; margin-bottom: 2px; color: #397b80; font-size: .72em; letter-spacing: .08em; }
  .address { display: block; color: inherit; text-decoration: none; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; letter-spacing: -.03em; }
  .address:focus-visible { outline: 2px solid rgba(57, 123, 128, .65); outline-offset: 2px; }
  .bubble::after {
    content: ""; position: absolute; left: 100%; top: 50%;
    width: 0; height: 0; border-top: 6px solid transparent;
    border-bottom: 6px solid transparent; border-left: 8px solid rgba(207, 239, 226, .88);
    transform: translateY(-50%);
  }
  .bubble::before { display: none; }
  @keyframes levitate {
    from { transform: translateY(4px); }
    to { transform: translateY(-4px); }
  }
  @container (min-height: 320px) {
    .cat-stage { flex-direction: column; gap: clamp(8px, 2cqh, 22px); }
    #cat { width: min(68cqw, 680px); height: min(76cqh, 680px); margin-inline-start: 0; }
    .bubble { transform: translateY(0) translateX(-8%); }
    .bubble::after {
      left: 28%; top: 100%; border-top: 10px solid rgba(207, 239, 226, .88);
      border-right: 7px solid transparent; border-left: 7px solid transparent;
      border-bottom: 0; transform: translate(-50%, -2px);
    }
    .bubble::before {
      left: 28%; top: 100%; border-top: 8px solid rgba(207, 239, 226, .88);
      border-right: 5px solid transparent; border-left: 5px solid transparent;
      border-bottom: 0; transform: translate(-50%, -5px);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    #cat { animation: none; }
  }
</style>
</head>

o6AI+AIOAKOgCPgCDgCb0AE/gefuzkqK671fAAAAABJRU5ErkJggg=='
  ];
  var gameScene = document.getElementById('game-scene');
  var catScene = document.getElementById('cat-scene');
  var catImage = document.getElementById('cat');
  var stockholmClock = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/Stockholm', year: 'numeric', month: 'numeric',
    day: 'numeric', hour: 'numeric', minute: 'numeric', hourCycle: 'h23'
  });

  function stockholmFields(now) {
    var fields = {};
    var parts = stockholmClock.formatToParts(now);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].type !== 'literal') fields[parts[i].type] = Number(parts[i].value);
    }
    return fields;
  }

  function showTimedScene() {
    var now = new Date();
    var f = stockholmFields(now);
    var catMinute = f.minute % 2 === 1;
    gameScene.classList.toggle('active', !catMinute);
    catScene.classList.toggle('active', catMinute);
    gameScene.setAttribute('aria-hidden', String(catMinute));
    catScene.setAttribute('aria-hidden', String(!catMinute));
    if (catMinute) {
      var serialMinute = (((f.year * 12 + f.month) * 31 + f.day) * 24 + f.hour) * 60 + f.minute;
      catImage.src = CAT_IMAGES[Math.floor(serialMinute / 2) % CAT_IMAGES.length];
    } else {
      fit();
    }
    window.setTimeout(showTimedScene,
      60000 - now.getSeconds() * 1000 - now.getMilliseconds() + 20);
  }

  // --- the automaton -------------------------------------------------
  // Conway's Game of Life. To run a different rule, edit these two
  // tables: BORN[n] = a dead cell with n live neighbours is born,
  // SURVIVE[n] = a live cell with n live neighbours stays alive.
  // (HighLife would be BORN 3 and 6; Seeds would be BORN 2, SURVIVE none.)
  var BORN    = [0, 0, 0, 1, 0, 0, 0, 0, 0];
  var SURVIVE = [0, 0, 1, 1, 0, 0, 0, 0, 0];

  var GEN_MS  = 90;    // ms per generation - slow enough to read at a distance
  var MAX_GEN = 1800;  // hard reseed, so a quiet board never lingers
  var HIST    = 16;    // recent state hashes kept, for cycle detection
  var STALL   = 3;     // repeated hashes in a row before we call it stalled
  var DENSITY = 0.32;  // live fraction of a fresh soup

  // Age gradient: index 0 is newborn, last index is long-settled. Fresh
  // activity glows, still lifes sink back toward the background.
  var AGE_COLORS = ['#8ef7b4', '#35e07c', '#27b566', '#1f9e57', '#166b3f', '#0f4a2c'];
  var BG = '#0b120d';

  var board = document.getElementById('board');
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d', { alpha: false });
  var genOut = document.getElementById('gen');

  var cols = 0, rows = 0, cell = 0, offX = 0, offY = 0;
  var cur = null, next = null, age = null;
  var gen = 0, hashes = [], hashAt = 0, stalledFor = 0;
  var buckets = [];
  for (var b = 0; b < AGE_COLORS.length; b++) buckets.push([]);

  function seed() {
    for (var i = 0; i < cur.length; i++) {
      cur[i] = Math.random() < DENSITY ? 1 : 0;
      age[i] = cur[i];
    }
    gen = 0;
    hashes.length = 0;
    hashAt = 0;
    stalledFor = 0;
  }

  function allocate(c, r) {
    cols = c;
    rows = r;
    cur  = new Uint8Array(c * r);
    next = new Uint8Array(c * r);
    age  = new Uint8Array(c * r);
    seed();
  }

  // Resize to the container. The dashboard shows this tile small in the
  // grid and fullscreen in monitor mode, so the grid is derived from the
  // box rather than fixed. Hidden scenes report 0x0 - ignore those, and
  // only rebuild the grid when the cell count actually changes, so being
  // hidden and shown again does not wipe the board.
  function fit() {
    var w = board.clientWidth;
    var h = board.clientHeight;
    if (w < 8 || h < 8) return;

    var dpr = window.devicePixelRatio || 1;
    canvas.width  = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    cell = Math.max(3, Math.min(14, Math.round(w / 110)));
    var c = Math.max(8, Math.floor(w / cell));
    var r = Math.max(8, Math.floor(h / cell));
    offX = Math.floor((w - c * cell) / 2);
    offY = Math.floor((h - r * cell) / 2);

    if (c !== cols || r !== rows) allocate(c, r);
    draw();
  }

  function step() {
    var i = 0;
    for (var y = 0; y < rows; y++) {
      var up = ((y - 1 + rows) % rows) * cols;
      var mid = y * cols;
      var dn = ((y + 1) % rows) * cols;
      for (var x = 0; x < cols; x++, i++) {
        var l = (x - 1 + cols) % cols;
        var rt = (x + 1) % cols;
        var n = cur[up + l] + cur[up + x] + cur[up + rt] +
                cur[mid + l]              + cur[mid + rt] +
                cur[dn + l] + cur[dn + x] + cur[dn + rt];
        var alive = cur[i];
        var live = alive ? SURVIVE[n] : BORN[n];
        next[i] = live;
        if (!live) age[i] = 0;
        else if (!alive) age[i] = 1;
        else if (age[i] < 255) age[i]++;
      }
    }
    var swap = cur; cur = next; next = swap;
    gen++;
  }

  // FNV-1a over the live/dead bits, to spot a dead or cycling board.
  function hash() {
    var h = 0x811c9dc5;
    for (var i = 0; i < cur.length; i++) {
      h ^= cur[i];
      h = (h + (h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24)) >>> 0;
    }
    return h;
  }

  function population() {
    var n = 0;
    for (var i = 0; i < cur.length; i++) n += cur[i];
    return n;
  }

  function checkStall() {
    if (gen >= MAX_GEN || population() === 0) { seed(); return; }
    var h = hash();
    var seen = hashes.indexOf(h) !== -1;
    stalledFor = seen ? stalledFor + 1 : 0;
    hashes[hashAt] = h;
    hashAt = (hashAt + 1) % HIST;
    if (stalledFor >= STALL) seed();
  }

  function draw() {
    if (!cur) return;
    var w = canvas.width / (window.devicePixelRatio || 1);
    var h = canvas.height / (window.devicePixelRatio || 1);
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, w, h);

    var last = AGE_COLORS.length - 1;
    for (var b = 0; b < buckets.length; b++) buckets[b].length = 0;
    var i = 0;
    for (var y = 0; y < rows; y++) {
      for (var x = 0; x < cols; x++, i++) {
        if (!cur[i]) continue;
        var a = age[i] - 1;
        buckets[a < last ? a : last].push(x, y);
      }
    }

    var size = cell > 4 ? cell - 1 : cell;
    for (var k = 0; k < buckets.length; k++) {
      var pts = buckets[k];
      if (!pts.length) continue;
      ctx.fillStyle = AGE_COLORS[k];
      for (var p = 0; p < pts.length; p += 2) {
        ctx.fillRect(offX + pts[p] * cell, offY + pts[p + 1] * cell, size, size);
      }
    }

    genOut.textContent = 'gen ' + String(gen).padStart(4, '0');
  }

  // A plain interval, like the other cells on this board. requestAnimation-
  // Frame would be the tidier choice, but Chrome suspends it outright
  // whenever it stops painting this frame - and a cell frozen on a dead
  // soup looks broken next to neighbours that keep cycling. Intervals get
  // throttled to about 1 tick/s when hidden instead of stopping, so the
  // board stays alive and picks the pace back up when it is on screen.
  function tick() {
    step();
    checkStall();
    draw();
  }

  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(fit).observe(board);
  } else {
    window.addEventListener('resize', fit);
  }
  fit();
  setInterval(tick, GEN_MS);
  showTimedScene();
})();
